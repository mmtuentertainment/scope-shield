# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbit Pro Configuration for ScopeShield Chrome Extension
# Optimized for constitutional compliance, modular architecture, and Chrome best practices

reviews:
  profile: assertive
  high_level_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "feat/.*"

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: warning
      threshold: 80

    title:
      mode: warning

    custom_checks:
      - mode: error
        name: "Constitutional Compliance"
        instructions: "Verify 8 principles in memory/constitution.md: Privacy-First (no external APIs), Simplicity-First (files ≤250 lines, no AI/ML), Performance (<500ms), Zero Infrastructure, User Value, Chrome Compliance (Manifest V3), Measurable Success, Graceful Degradation. FAIL if violations found."

      - mode: error
        name: "Modular Architecture"
        instructions: "Check .claude/code-standards.md: Files ≤250 lines, functions ≤75 lines. If exceeded, verify extraction patterns applied (Template/Handler/State/Renderer/Formatter/Extractor). FAIL if >250 lines without extraction."

      - mode: error
        name: "Chrome Security"
        instructions: "Check for: innerHTML with user content, eval(), document.write(), inline handlers, external scripts, missing chrome.storage error handling, XSS vectors. FAIL if critical violations found."

      - mode: warning
        name: "Performance Budget"
        instructions: "Verify targets: detection <500ms, PDF <3s, popup <500ms per memory/constitution.md. Check for sync ops in loops, missing debouncing, blocking calls. WARN if anti-patterns found."

  path_filters:
    - "!**/*.md"
    - "!**/*.png"
    - "!**/package-lock.json"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "src/**/*.js"
    - "tests/**/*.test.js"

  path_instructions:
    - path: "src/lib/change-order/ChangeOrderService.js"
      instructions: "Review: multi-detection merge, error recovery, history failures, performance <5s, delegation pattern"

    - path: "src/lib/change-order/ChangeOrderHistory.js"
      instructions: "Review: FIFO at 50 orders, race conditions, quota errors, schema versioning"

    - path: "src/lib/export/**/*.js"
      instructions: "Review: jsPDF integration, blob/download flow, PDF→text fallback, <3s performance, memory cleanup"

    - path: "src/popup/**/*.js"
      instructions: "Review: state management, event cleanup, XSS prevention, memory leaks"

    - path: "src/lib/storage/**/*.js"
      instructions: "Review: chrome.storage.local error handling, schema migrations, concurrent writes"

    - path: "src/manifest.json"
      instructions: "Review: Manifest V3, minimal permissions (activeTab/storage/notifications only), CSP policy"

  tools:
    eslint:
      enabled: true
    gitleaks:
      enabled: true
    languagetool:
      enabled: true
      level: picky
    shellcheck:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 180000
