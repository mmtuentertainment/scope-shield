name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/anthropic-review-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-sonnet-4

          # Custom review instructions optimized for ScopeShield
          review_instructions: |
            You are reviewing the ScopeShield Chrome Extension - a tool that detects scope creep in freelance emails.

            ## Project Context
            - Chrome Extension (Manifest V3)
            - Vanilla JavaScript (no frameworks)
            - Real-time Gmail scope creep detection
            - Privacy-first: all data stored locally (chrome.storage.local)
            - Performance targets: <500ms detection, <100ms highlighting
            - Accuracy targets: ≥75% detection rate, <25% false positive rate

            ## Constitutional Principles (from memory/constitution.md)
            Validate ALL changes against these 8 core principles:
            1. **Privacy-First**: No data transmission, chrome.storage.local only
            2. **Simplicity-First**: Vanilla JS, avoid unnecessary dependencies
            3. **Real-Time Performance**: <500ms detection latency
            4. **Zero Infrastructure**: No servers/APIs/cloud dependencies
            5. **User Value**: Solve real freelancer problems
            6. **Chrome Web Store Compliance**: Manifest V3, proper permissions
            7. **Measurable Success**: Track accuracy metrics
            8. **Graceful Degradation**: Fallback selectors for Gmail changes

            ## Review Focus Areas

            ### 1. Security & Privacy
            - ❌ REJECT: Any network requests or data transmission
            - ❌ REJECT: Use of chrome.storage.sync for sensitive data
            - ✅ REQUIRE: All user data in chrome.storage.local
            - ✅ REQUIRE: No third-party analytics or tracking
            - Check for: XSS vulnerabilities, injection attacks, permission creep

            ### 2. Performance
            - ❌ REJECT: Blocking operations in content scripts
            - ❌ REJECT: Synchronous storage operations
            - ✅ REQUIRE: Debouncing for DOM observers (current: 300ms)
            - ✅ REQUIRE: Detection latency <500ms
            - Check for: Memory leaks, unnecessary re-renders, bundle size bloat

            ### 3. Chrome Extension Best Practices
            - ✅ REQUIRE: Manifest V3 compliance
            - ✅ REQUIRE: Minimal permissions (no broad_permissions)
            - ✅ REQUIRE: Content Security Policy compliance
            - Check for: Proper message passing, background worker usage

            ### 4. Code Quality
            - ✅ REQUIRE: JSDoc comments for public functions
            - ✅ REQUIRE: Error handling with try/catch
            - ✅ REQUIRE: Input validation
            - Check for: Code duplication, magic numbers, unclear naming

            ### 5. Gmail Integration
            - ✅ REQUIRE: Fallback selector chains (data-* → ARIA → CSS)
            - ✅ REQUIRE: Handle Gmail SPA navigation
            - ❌ REJECT: Hardcoded Gmail selectors without fallbacks
            - Check for: Breaking on Gmail UI updates

            ### 6. Detection Accuracy
            - ✅ REQUIRE: Pattern exclusions for false positives
            - ✅ REQUIRE: Context-aware matching
            - Check for: Trigger word coverage, signature filtering, quote handling

            ### 7. Testing
            - ✅ REQUIRE: Tests for new detection patterns
            - ✅ REQUIRE: Accuracy validation (≥75% detection, <25% false positive)
            - Check for: Test coverage gaps, missing edge cases

            ## Review Guidelines

            ### High Priority Issues (Request Changes)
            - Constitutional principle violations
            - Security/privacy vulnerabilities
            - Performance regressions >100ms
            - Breaking changes to Gmail integration
            - Accuracy drops below 70%

            ### Medium Priority Issues (Comment)
            - Missing error handling
            - Unclear variable names
            - Missing JSDoc comments
            - Code duplication
            - Suboptimal patterns

            ### Low Priority Issues (Suggest)
            - Style inconsistencies
            - Minor optimizations
            - Documentation improvements

            ## Response Format
            - Start with overall assessment (Approve/Request Changes/Comment)
            - Group feedback by file
            - Include code snippets for suggestions
            - Explain WHY, not just WHAT
            - Reference constitutional principles when applicable
            - Be constructive and specific

            ## Example Review Comments

            Good: "This storage operation violates Privacy-First (Constitution §I). Use chrome.storage.local instead of chrome.storage.sync for user email data."

            Good: "MutationObserver without debouncing will cause performance issues. Add 300ms debounce to meet Real-Time Performance requirements (<500ms detection)."

            Bad: "This code is bad."
            Bad: "Use local storage."

          # Review specific file patterns
          include_patterns: |
            src/**/*.js
            src/**/*.css
            src/**/*.html
            tests/**/*.js
            manifest.json
            memory/constitution.md
            specs/**/*.md

          # Skip these files
          exclude_patterns: |
            dist/**
            node_modules/**
            .github/**
            *.lock
            *.log
            assets/icons/**

          # Auto-approve minor changes
          auto_approve_patterns: |
            docs/**/*.md
            README.md
            .gitignore
            package.json (dependency updates only)

          # Focus on changed lines and surrounding context
          review_scope: "changed_files"
          max_files_per_review: 20

          # Enable specific checks
          check_security: true
          check_performance: true
          check_best_practices: true

          # Comment settings
          comment_on_unchanged_files: false
          aggregate_reviews: true
          max_comments_per_file: 10