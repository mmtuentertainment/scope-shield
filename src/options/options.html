<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScopeShield Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>ScopeShield Settings</h1>
    </header>

    <section>
      <h2>Detection Settings</h2>
      <div class="setting">
        <label>
          <input type="checkbox" id="enable-notifications" checked>
          Show browser notifications
        </label>
      </div>
      <div class="setting">
        <label>
          <input type="checkbox" id="enable-highlights" checked>
          Highlight detected text
        </label>
      </div>
      <div class="setting">
        <label>
          Confidence threshold:
          <select id="confidence-threshold">
            <option value="1">All (1+)</option>
            <option value="5" selected>Medium (5+)</option>
            <option value="8">High (8+)</option>
          </select>
        </label>
      </div>
    </section>

    <section>
      <h2>Visual Settings</h2>
      <div class="setting">
        <label>
          Highlight color:
          <input type="color" id="highlight-color" value="#FFEB3B">
        </label>
      </div>
      <div class="setting">
        <label>
          Highlight opacity:
          <input type="range" id="highlight-opacity" min="0.3" max="1" step="0.1" value="0.8">
          <span id="opacity-value">80%</span>
        </label>
      </div>
    </section>

    <div class="actions">
      <button id="save">Save Settings</button>
      <button id="reset">Reset to Defaults</button>
    </div>

    <div id="status"></div>
  </div>

  <script src="options.js" type="module"></script>
</body>
</html>
